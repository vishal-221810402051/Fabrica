[project]
name = "fabrica-api"
version = "0.1.0"
description = "Fabricgamma API service foundation."
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.124.0",
  "pydantic-settings>=2.12.0",
  "uvicorn[standard]>=0.38.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fabrica_api"
module-root = "src"
