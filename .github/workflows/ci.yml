name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  javascript:
    name: JavaScript and TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Check formatting
        run: corepack pnpm exec prettier . --check

      - name: Lint
        run: corepack pnpm --recursive --if-present lint

      - name: Type check
        run: corepack pnpm --recursive --if-present typecheck

      - name: Test
        run: corepack pnpm --recursive --if-present test

      - name: Build
        run: corepack pnpm --recursive --if-present build

      - name: Check generated project schema
        run: corepack pnpm schema:check

  python:
    name: Python services
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.12.1

      - name: Sync Python workspace
        run: python -m uv sync --locked

      - name: Check Python formatting
        run: python -m uv run ruff format --check apps/api cad-service

      - name: Lint Python
        run: python -m uv run ruff check apps/api cad-service

      - name: Type check Python
        run: python -m uv run pyright apps/api/src cad-service/src

      - name: Test Python
        run: python -m uv run pytest

  configuration:
    name: Configuration and safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check Compose configuration
        run: docker compose config

      - name: Scan for common credential patterns
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          patterns = {
              "OpenAI-style secret": re.compile(r"\bsk-[A-Za-z0-9_-]{16,}\b"),
              "GitHub token": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}\b"),
              "Private key": re.compile(r"BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY"),
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
          }

          findings = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.name in {"debug.log", "pnpm-lock.yaml", "uv.lock"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for line_number, line in enumerate(text.splitlines(), start=1):
                  for name, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append(f"{path}:{line_number}: {name}")

          if findings:
              print("Potential credential patterns detected:")
              for finding in findings:
                  print(f"- {finding}")
              sys.exit(1)

          print("No common credential patterns detected.")
